[package]
name = "zgym-desktop"
version = "0.1.0"
description = "ZGym Desktop — thin-client Tauri ke ZGym (SaaS gym management)"
authors = ["zomet"]
edition = "2021"

[lib]
name = "zgym_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
