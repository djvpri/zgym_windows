[package]
name = "zxgym-desktop"
version = "0.1.9"
description = "ZXgym Desktop — thin-client Tauri ke ZXgym (SaaS gym management)"
authors = ["zomet"]
edition = "2021"

[lib]
name = "zxgym_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
