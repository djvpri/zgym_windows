name: build-windows

# Compile check + paket Windows utk ZXgym Desktop (thin-client Tauri ke ZXgym SaaS).
# Jalan saat push/pull ke main — judge utama verifikasi kode Rust compile di Windows.
# Rilis (setup.exe upload) via workflow_dispatch yg dipanggil manual: [release pipeline].
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi yang dirilis, mis. 0.1.0 (tanpa awalan v)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install NSIS (bundler butuh makensis)
        shell: bash
        run: choco install nsis -y --no-progress || true

      - name: Build (release + NSIS)
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: zxgym-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
